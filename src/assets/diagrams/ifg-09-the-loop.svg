<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" width="900" height="780" role="img" aria-label="Four questions arranged as a loop around a fixed test set" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How do you know it works?</title>
  <defs>
    <style>
      .h  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .t  { font-family: Archivo, system-ui, sans-serif; font-weight: 700; }
      .l  { font-family: Archivo, system-ui, sans-serif; font-weight: 600; }
      .m  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .b  { font-family: Newsreader, Georgia, serif; }
      .bi { font-family: Newsreader, Georgia, serif; font-style: italic; }
    </style>
    <marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A3FD6"/>
    </marker>
  </defs>

  <rect width="900" height="780" fill="#F4F2FA"/>

  <text x="40" y="42" class="h" font-size="21" fill="#171522">How do you know it works?</text>
  <text x="40" y="66" class="bi" font-size="14" fill="#3C4148">Not a checklist you finish. A loop you come back to.</text>

  <!-- LOOP PATH -->
  <circle cx="450" cy="410" r="212" fill="none" stroke="#5A3FD6" stroke-width="2" stroke-dasharray="6 8" opacity="0.55"/>
  <path d="M 450 198 A 212 212 0 0 1 604 268" fill="none" stroke="#5A3FD6" stroke-width="2.5" marker-end="url(#loop)"/>
  <path d="M 662 410 A 212 212 0 0 1 604 552" fill="none" stroke="#5A3FD6" stroke-width="2.5" marker-end="url(#loop)"/>
  <path d="M 450 622 A 212 212 0 0 1 296 552" fill="none" stroke="#5A3FD6" stroke-width="2.5" marker-end="url(#loop)"/>
  <path d="M 238 410 A 212 212 0 0 1 296 268" fill="none" stroke="#5A3FD6" stroke-width="2.5" marker-end="url(#loop)"/>

  <!-- CENTRE : the pivot -->
  <circle cx="450" cy="410" r="96" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2.5"/>
  <text x="450" y="386" class="m" font-size="9" fill="#5A3FD6" text-anchor="middle">THE PIVOT</text>
  <text x="450" y="412" class="t" font-size="16" fill="#171522" text-anchor="middle">One fixed</text>
  <text x="450" y="434" class="t" font-size="16" fill="#171522" text-anchor="middle">set of cases</text>
  <text x="450" y="458" class="b" font-size="11.5" fill="#3C4148" text-anchor="middle">Written before you test</text>

  <!-- NODE 1 : top -->
  <circle cx="450" cy="198" r="13" fill="#5A3FD6"/>
  <text x="450" y="203" class="m" font-size="10" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="450" y="152" class="t" font-size="16" fill="#171522" text-anchor="middle">Does it work?</text>
  <text x="450" y="174" class="b" font-size="12.5" fill="#3C4148" text-anchor="middle">Include the cases you expect it to fail — those are the informative ones.</text>

  <!-- NODE 2 : right -->
  <circle cx="662" cy="410" r="13" fill="#5A3FD6"/>
  <text x="662" y="415" class="m" font-size="10" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="694" y="344" width="184" height="132" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="712" y="372" class="t" font-size="15" fill="#171522">Would someone</text>
  <text x="712" y="392" class="t" font-size="15" fill="#171522">else find the same?</text>
  <text x="712" y="418" class="b" font-size="12" fill="#3C4148">A second evaluator with</text>
  <text x="712" y="435" class="b" font-size="12" fill="#3C4148">a different calibration.</text>
  <text x="712" y="459" class="t" font-size="12" fill="#5A3FD6">Same one twice ≠ a test.</text>

  <!-- NODE 3 : bottom -->
  <circle cx="450" cy="622" r="13" fill="#5A3FD6"/>
  <text x="450" y="627" class="m" font-size="10" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="450" y="668" class="t" font-size="16" fill="#171522" text-anchor="middle">Why did it fail?</text>
  <text x="450" y="690" class="b" font-size="12.5" fill="#3C4148" text-anchor="middle">Export the structure and have it critiqued. Screenshots hide the misconfigured step.</text>

  <!-- NODE 4 : left -->
  <circle cx="238" cy="410" r="13" fill="#5A3FD6"/>
  <text x="238" y="415" class="m" font-size="10" fill="#FFFFFF" text-anchor="middle">4</text>
  <rect x="22" y="344" width="184" height="132" fill="#FFFFFF" stroke="#171522" stroke-width="1.5" rx="3"/>
  <text x="40" y="372" class="t" font-size="15" fill="#171522">Has it drifted?</text>
  <text x="40" y="398" class="b" font-size="12" fill="#3C4148">Re-run the same set on</text>
  <text x="40" y="415" class="b" font-size="12" fill="#3C4148">a schedule. Compare.</text>
  <text x="40" y="440" class="b" font-size="12" fill="#3C4148">No baseline, no drift —</text>
  <text x="40" y="457" class="b" font-size="12" fill="#3C4148">only complaints.</text>

  <!-- WHY IT LOOPS -->
  <text x="40" y="736" class="b" font-size="12.5" fill="#3C4148">Question 4 hands you back to question 1 with a dated result. That's what makes the set worth freezing — and what makes drift visible at all.</text>

  <text x="40" y="762" class="m" font-size="9.5" fill="#5A3FD6">CARDS → GOV·01 DOUBLE-TEST · EVL·01 BENCHMARKS · BLD·04 DEBUGGING VIA EXPORT</text>
</svg>
