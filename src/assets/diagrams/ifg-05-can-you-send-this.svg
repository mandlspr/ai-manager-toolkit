<svg viewBox="0 0 900 880" xmlns="http://www.w3.org/2000/svg" width="900" height="880" role="img" aria-label="Decision tree: can you send this data to that model" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Can you send this data to that model?</title>
  <defs>
    <style>
      .h  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .t  { font-family: Archivo, system-ui, sans-serif; font-weight: 700; }
      .l  { font-family: Archivo, system-ui, sans-serif; font-weight: 600; }
      .m  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .b  { font-family: Newsreader, Georgia, serif; }
      .bi { font-family: Newsreader, Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="900" height="880" fill="#F4F2FA"/>

  <text x="40" y="42" class="h" font-size="21" fill="#171522">Can you send this data to that model?</text>
  <text x="40" y="64" class="bi" font-size="13.5" fill="#3C4148">Follow the trunk down. Each branch throws you out to the right.</text>

  <!-- TRUNK -->
  <line x1="180" y1="112" x2="180" y2="768" stroke="#171522" stroke-width="2.5"/>

  <!-- NODE 1 -->
  <circle cx="180" cy="130" r="7" fill="#171522"/>
  <rect x="208" y="106" width="330" height="52" fill="#FFFFFF" stroke="#171522" stroke-width="1.5" rx="3"/>
  <text x="226" y="128" class="t" font-size="14" fill="#171522">Is anyone identifiable in it?</text>
  <text x="226" y="147" class="b" font-size="11.5" fill="#6B6875">Directly, or by combining fields.</text>

  <line x1="538" y1="132" x2="584" y2="132" stroke="#3E6B4F" stroke-width="2"/>
  <path d="M 578 126 L 586 132 L 578 138" fill="#3E6B4F"/>
  <rect x="592" y="108" width="268" height="48" fill="#FFFFFF" stroke="#3E6B4F" stroke-width="2" rx="3"/>
  <text x="608" y="128" class="m" font-size="9" fill="#3E6B4F">NO — AND NO TRADE SECRET</text>
  <text x="608" y="147" class="t" font-size="14" fill="#3E6B4F">Send it. Nothing to lock.</text>

  <text x="196" y="182" class="m" font-size="9" fill="#6B6875">YES — OR IT'S A TRADE SECRET</text>

  <!-- NODE 2 -->
  <circle cx="180" cy="216" r="7" fill="#171522"/>
  <rect x="208" y="192" width="330" height="52" fill="#FFFFFF" stroke="#171522" stroke-width="1.5" rx="3"/>
  <text x="226" y="214" class="t" font-size="14" fill="#171522">Is it a business account?</text>
  <text x="226" y="233" class="b" font-size="11.5" fill="#6B6875">Not a personal one used for work.</text>

  <line x1="538" y1="218" x2="584" y2="218" stroke="#B03A2E" stroke-width="2"/>
  <path d="M 578 212 L 586 218 L 578 224" fill="#B03A2E"/>
  <rect x="592" y="190" width="268" height="56" fill="#F7E9E7" stroke="#B03A2E" stroke-width="2" rx="3"/>
  <text x="608" y="210" class="m" font-size="9" fill="#B03A2E">NO</text>
  <text x="608" y="229" class="t" font-size="14" fill="#B03A2E">Stop. This is Shadow AI.</text>
  <text x="608" y="243" class="b" font-size="10.5" fill="#B03A2E">Nothing downstream fixes it.</text>

  <text x="196" y="268" class="m" font-size="9" fill="#6B6875">YES</text>

  <!-- NODE 3 -->
  <circle cx="180" cy="302" r="7" fill="#5A3FD6"/>
  <rect x="208" y="274" width="330" height="60" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="226" y="294" class="m" font-size="9" fill="#5A3FD6">LOCK 1</text>
  <text x="226" y="314" class="t" font-size="14" fill="#171522">Do you know where the servers sit?</text>
  <text x="226" y="330" class="b" font-size="11.5" fill="#3C4148">In writing, not from the marketing page.</text>

  <line x1="538" y1="304" x2="584" y2="304" stroke="#B08A2E" stroke-width="2"/>
  <path d="M 578 298 L 586 304 L 578 310" fill="#B08A2E"/>
  <rect x="592" y="282" width="268" height="44" fill="#FFFFFF" stroke="#B08A2E" stroke-width="1.5" rx="3"/>
  <text x="608" y="300" class="m" font-size="9" fill="#B08A2E">NO</text>
  <text x="608" y="318" class="t" font-size="13" fill="#B08A2E">Ask before sending anything.</text>

  <!-- NODE 4 -->
  <circle cx="180" cy="392" r="7" fill="#5A3FD6"/>
  <rect x="208" y="364" width="330" height="60" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="226" y="384" class="m" font-size="9" fill="#5A3FD6">LOCK 2</text>
  <text x="226" y="404" class="t" font-size="14" fill="#171522">Is a processing agreement signed?</text>
  <text x="226" y="420" class="b" font-size="11.5" fill="#3C4148">With a named legal entity.</text>

  <line x1="538" y1="394" x2="584" y2="394" stroke="#B08A2E" stroke-width="2"/>
  <path d="M 578 388 L 586 394 L 578 400" fill="#B08A2E"/>
  <rect x="592" y="372" width="268" height="44" fill="#FFFFFF" stroke="#B08A2E" stroke-width="1.5" rx="3"/>
  <text x="608" y="390" class="m" font-size="9" fill="#B08A2E">NO</text>
  <text x="608" y="408" class="t" font-size="13" fill="#B08A2E">Get it signed, or strip the data.</text>

  <!-- NODE 5 -->
  <circle cx="180" cy="482" r="7" fill="#5A3FD6"/>
  <rect x="208" y="454" width="330" height="60" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="226" y="474" class="m" font-size="9" fill="#5A3FD6">LOCK 3</text>
  <text x="226" y="494" class="t" font-size="14" fill="#171522">Is training opt-out written in the terms?</text>
  <text x="226" y="510" class="b" font-size="11.5" fill="#3C4148">Not a toggle you found in the settings.</text>

  <line x1="538" y1="484" x2="584" y2="484" stroke="#B08A2E" stroke-width="2"/>
  <path d="M 578 478 L 586 484 L 578 490" fill="#B08A2E"/>
  <rect x="592" y="462" width="268" height="44" fill="#FFFFFF" stroke="#B08A2E" stroke-width="1.5" rx="3"/>
  <text x="608" y="480" class="m" font-size="9" fill="#B08A2E">NO</text>
  <text x="608" y="498" class="t" font-size="13" fill="#B08A2E">Abstract it. No names, no specifics.</text>

  <text x="196" y="546" class="m" font-size="9" fill="#6B6875">ALL THREE OPEN</text>

  <!-- NODE 6 : model regime -->
  <circle cx="180" cy="586" r="7" fill="#171522"/>
  <rect x="208" y="558" width="652" height="112" fill="#FFFFFF" stroke="#171522" stroke-width="1.5" rx="3"/>
  <text x="226" y="580" class="m" font-size="9" fill="#6B6875">LAST QUESTION — CHANGES WHO ANSWERS FOR THE LOCKS, NOT WHETHER THEY APPLY</text>
  <text x="226" y="602" class="t" font-size="14" fill="#171522">Who controls the model?</text>

  <rect x="226" y="614" width="196" height="42" fill="#F4F2FA" stroke="#D8D5E0" rx="3"/>
  <text x="238" y="632" class="l" font-size="12" fill="#171522">Closed</text>
  <text x="238" y="648" class="b" font-size="10.5" fill="#6B6875">Provider's contract carries them</text>

  <rect x="430" y="614" width="196" height="42" fill="#F4F2FA" stroke="#D8D5E0" rx="3"/>
  <text x="442" y="632" class="l" font-size="12" fill="#171522">Open weights</text>
  <text x="442" y="648" class="b" font-size="10.5" fill="#6B6875">You do, if you self-host</text>

  <rect x="634" y="614" width="212" height="42" fill="#F4F2FA" stroke="#D8D5E0" rx="3"/>
  <text x="646" y="632" class="l" font-size="12" fill="#171522">Open source</text>
  <text x="646" y="648" class="b" font-size="10.5" fill="#6B6875">You do, entirely</text>

  <!-- FINAL -->
  <circle cx="180" cy="768" r="9" fill="#3E6B4F"/>
  <rect x="208" y="740" width="652" height="56" fill="#FFFFFF" stroke="#3E6B4F" stroke-width="2" rx="3"/>
  <text x="226" y="762" class="t" font-size="15" fill="#3E6B4F">Send it — and write down which locks you checked, and when</text>
  <text x="226" y="782" class="b" font-size="11.5" fill="#3C4148">That record is what makes the decision defensible later. Without it, you have a habit, not a control.</text>

  <rect x="40" y="812" width="820" height="30" fill="#B03A2E" rx="3"/>
  <text x="58" y="832" class="t" font-size="12.5" fill="#FFFFFF">Paid does not mean protected. A consumer subscription with an opt-out toggle opens Lock 3 and neither of the other two.</text>

  <text x="40" y="866" class="m" font-size="9" fill="#6B6875">SOURCES · COURSE MATERIAL W1, W3 · AI GOVERNANCE &amp; CX ENABLEMENT PLAYBOOK</text>
</svg>
