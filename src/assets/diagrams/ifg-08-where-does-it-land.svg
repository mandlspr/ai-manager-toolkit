<svg viewBox="0 0 980 900" xmlns="http://www.w3.org/2000/svg" width="980" height="900" role="img" aria-label="EU AI Act triage tool" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Where does this use case land?</title>
  <defs>
    <style>
      .h  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .t  { font-family: Archivo, system-ui, sans-serif; font-weight: 700; }
      .l  { font-family: Archivo, system-ui, sans-serif; font-weight: 600; }
      .m  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .b  { font-family: Newsreader, Georgia, serif; }
      .bi { font-family: Newsreader, Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="980" height="900" fill="#F4F2FA"/>

  <text x="40" y="42" class="h" font-size="21" fill="#171522">Where does this use case land?</text>
  <text x="40" y="64" class="bi" font-size="13.5" fill="#3C4148">Four gates, in order. Stop at the first that catches. Classify the use case, not how dangerous the technology feels.</text>

  <!-- STEP 0 -->
  <text x="40" y="98" class="m" font-size="9" fill="#6B6875">FIRST, DESCRIBE IT IN FOUR TERMS</text>
  <rect x="40" y="106" width="150" height="26" fill="#FFFFFF" stroke="#D8D5E0" rx="13"/>
  <text x="115" y="123" class="l" font-size="10.5" fill="#171522" text-anchor="middle">Intended purpose</text>
  <rect x="198" y="106" width="150" height="26" fill="#FFFFFF" stroke="#D8D5E0" rx="13"/>
  <text x="273" y="123" class="l" font-size="10.5" fill="#171522" text-anchor="middle">Context of use</text>
  <rect x="356" y="106" width="150" height="26" fill="#FFFFFF" stroke="#D8D5E0" rx="13"/>
  <text x="431" y="123" class="l" font-size="10.5" fill="#171522" text-anchor="middle">People affected</text>
  <rect x="514" y="106" width="164" height="26" fill="#FFFFFF" stroke="#D8D5E0" rx="13"/>
  <text x="596" y="123" class="l" font-size="10.5" fill="#171522" text-anchor="middle">Role in the decision</text>

  <rect x="700" y="100" width="240" height="38" fill="#FFFFFF" stroke="#B08A2E" stroke-width="1.5" stroke-dasharray="5 3" rx="3"/>
  <text x="714" y="118" class="t" font-size="11.5" fill="#B08A2E">Missing a term? → CONDITIONAL</text>
  <text x="714" y="132" class="b" font-size="10.5" fill="#3C4148">Ask, don't guess. Max two questions.</text>

  <!-- GATE 1 -->
  <rect x="40" y="156" width="640" height="150" fill="#B03A2E" rx="3"/>
  <text x="62" y="182" class="m" font-size="9.5" fill="#F7C9C2">GATE 1 · ART. 5</text>
  <text x="62" y="206" class="h" font-size="17" fill="#FFFFFF">Any of these six? — Banned outright</text>

  <rect x="62" y="222" width="292" height="24" fill="#8E2D24" rx="12"/>
  <text x="76" y="238" class="b" font-size="11" fill="#FFFFFF">Manipulation impairing decisions</text>
  <rect x="364" y="222" width="294" height="24" fill="#8E2D24" rx="12"/>
  <text x="378" y="238" class="b" font-size="11" fill="#FFFFFF">Exploiting cognitive vulnerability</text>

  <rect x="62" y="252" width="292" height="24" fill="#8E2D24" rx="12"/>
  <text x="76" y="268" class="b" font-size="11" fill="#FFFFFF">Social scoring causing disadvantage</text>
  <rect x="364" y="252" width="294" height="24" fill="#8E2D24" rx="12"/>
  <text x="378" y="268" class="b" font-size="11" fill="#FFFFFF">Biometric inference of sensitive traits</text>

  <rect x="62" y="282" width="292" height="24" fill="#8E2D24" rx="12" transform="translate(0,-6)"/>
  <text x="76" y="292" class="b" font-size="11" fill="#FFFFFF">Predictive policing by profiling alone</text>
  <rect x="364" y="276" width="294" height="24" fill="#8E2D24" rx="12"/>
  <text x="378" y="292" class="b" font-size="11" fill="#FFFFFF">Emotion recognition at work *</text>

  <!-- GPAI parallel check -->
  <rect x="700" y="156" width="240" height="150" fill="#FFFFFF" stroke="#5A3FD6" stroke-width="1.5" rx="3"/>
  <text x="714" y="182" class="m" font-size="9.5" fill="#5A3FD6">RUNS IN PARALLEL</text>
  <text x="714" y="206" class="t" font-size="14" fill="#171522">Is a GPAI model</text>
  <text x="714" y="224" class="t" font-size="14" fill="#171522">involved?</text>
  <text x="714" y="250" class="b" font-size="11.5" fill="#3C4148">Not a level of the pyramid.</text>
  <text x="714" y="268" class="b" font-size="11.5" fill="#3C4148">A separate model category,</text>
  <text x="714" y="286" class="b" font-size="11.5" fill="#3C4148">with its own obligations.</text>

  <text x="62" y="326" class="b" font-size="10.5" fill="#6B6875">* unless on medical or safety grounds · no control makes a banned purpose compliant — redesign or drop it</text>

  <path d="M 348 336 L 360 348 L 372 336" stroke="#171522" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="388" y="349" class="m" font-size="9" fill="#6B6875">ALL NO</text>

  <!-- GATE 2 -->
  <rect x="40" y="364" width="900" height="158" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2.5" rx="3"/>
  <text x="62" y="390" class="m" font-size="9.5" fill="#5A3FD6">GATE 2 · ART. 6(2) + ANNEX III</text>
  <text x="62" y="414" class="h" font-size="17" fill="#171522">In one of these eight areas <tspan class="t" font-size="14" fill="#5A3FD6">AND</tspan> it materially influences the outcome for a person?</text>

  <rect x="62" y="430" width="210" height="24" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="72" y="446" class="b" font-size="11" fill="#171522">1 · Biometrics</text>
  <rect x="280" y="430" width="210" height="24" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="290" y="446" class="b" font-size="11" fill="#171522">2 · Critical infrastructure</text>
  <rect x="498" y="430" width="210" height="24" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="508" y="446" class="b" font-size="11" fill="#171522">3 · Education, training</text>
  <rect x="716" y="430" width="202" height="24" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="726" y="446" class="b" font-size="11" fill="#171522">4 · Employment, workers</text>

  <rect x="62" y="460" width="210" height="24" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="72" y="476" class="b" font-size="11" fill="#171522">5 · Essential services</text>
  <rect x="280" y="460" width="210" height="24" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="290" y="476" class="b" font-size="11" fill="#171522">6 · Law enforcement</text>
  <rect x="498" y="460" width="210" height="24" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="508" y="476" class="b" font-size="11" fill="#171522">7 · Migration, borders</text>
  <rect x="716" y="460" width="202" height="24" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="726" y="476" class="b" font-size="11" fill="#171522">8 · Justice, democracy</text>

  <text x="62" y="506" class="b" font-size="11" fill="#3C4148">Both true → <tspan class="t" fill="#5A3FD6">HIGH RISK.</tspan> Area alone is not enough — Art. 6(3) exempts systems that don't materially influence the outcome.</text>

  <path d="M 348 528 L 360 540 L 372 528" stroke="#171522" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="388" y="541" class="m" font-size="9" fill="#6B6875">NOT BOTH</text>

  <!-- GATE 3 -->
  <rect x="40" y="556" width="900" height="76" fill="#FFFFFF" stroke="#171522" stroke-width="1.5" rx="3"/>
  <text x="62" y="580" class="m" font-size="9.5" fill="#171522">GATE 3 · ART. 50</text>
  <text x="62" y="604" class="t" font-size="15" fill="#171522">Does someone interact with it, or see what it produced?</text>
  <text x="62" y="622" class="b" font-size="11.5" fill="#3C4148">Yes → disclose that it is AI, label generated content. Chatbots, synthetic media, generated text shown outside the team.</text>

  <path d="M 348 638 L 360 650 L 372 638" stroke="#171522" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- GATE 4 -->
  <rect x="40" y="666" width="900" height="72" fill="none" stroke="#B08A2E" stroke-width="1.5" stroke-dasharray="6 4" rx="3"/>
  <text x="62" y="690" class="m" font-size="9.5" fill="#B08A2E">GATE 4 · NOTHING CAUGHT</text>
  <text x="62" y="714" class="t" font-size="15" fill="#171522">Minimal risk under the AI Act — never green by default</text>
  <text x="62" y="731" class="b" font-size="11.5" fill="#3C4148">Legal classification is not business risk. GDPR, IP, fairness, data quality and customer trust still apply. Write down why nothing caught.</text>

  <!-- REASONING RULES -->
  <rect x="40" y="756" width="900" height="72" fill="#FFFFFF" stroke="#D8D5E0" rx="3"/>
  <text x="62" y="778" class="m" font-size="9" fill="#6B6875">THE SEVEN MISREADINGS THAT SEND A CASE TO THE WRONG GATE</text>
  <text x="62" y="800" class="b" font-size="12" fill="#171522">Dangerous ≠ prohibited · Sensitive ≠ high risk · Human review ≠ low risk · Scoring ≠ social scoring</text>
  <text x="62" y="820" class="b" font-size="12" fill="#171522">Deepfake ≠ prohibited · GPAI ≠ a risk level · Missing facts ≠ a guess</text>

  <!-- ART 4 -->
  <rect x="40" y="840" width="900" height="28" fill="#5A3FD6" rx="3"/>
  <text x="62" y="859" class="t" font-size="12" fill="#FFFFFF">ART. 4 · AI literacy obligation applies at every gate — in force since 2 February 2025</text>

  <text x="40" y="886" class="m" font-size="9" fill="#6B6875">SOURCES · REGULATION (EU) 2024/1689 VIA EUR-LEX · COURSE MATERIAL W7 · EU AI ACT USE CASE CHECKER V1</text>
</svg>
