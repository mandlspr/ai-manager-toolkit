<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" width="900" height="420" role="img" aria-label="Three shelf lives: three months, six months, indefinite" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>What expires, and when</title>
  <defs>
    <style>
      .h  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .n  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .t  { font-family: Archivo, system-ui, sans-serif; font-weight: 700; }
      .m  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .bi { font-family: Newsreader, Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="900" height="420" fill="#F4F2FA"/>

  <text x="40" y="46" class="h" font-size="24" fill="#171522">What expires, and when</text>

  <!-- scale -->
  <line x1="300" y1="92" x2="860" y2="92" stroke="#D8D5E0"/>
  <text x="300" y="82" class="m" font-size="9" fill="#6B6875">0</text>
  <text x="370" y="82" class="m" font-size="9" fill="#6B6875">3</text>
  <text x="440" y="82" class="m" font-size="9" fill="#6B6875">6</text>
  <text x="580" y="82" class="m" font-size="9" fill="#6B6875">12</text>
  <text x="860" y="82" class="m" font-size="9" fill="#6B6875" text-anchor="end">MONTHS</text>

  <!-- BAR 1 -->
  <text x="40" y="146" class="t" font-size="17" fill="#171522">Vendor claims</text>
  <rect x="300" y="126" width="70" height="34" fill="#B03A2E" rx="3"/>
  <circle cx="340" cy="143" r="5" fill="#F4F2FA"/>
  <text x="392" y="150" class="n" font-size="22" fill="#B03A2E">3</text>

  <!-- BAR 2 -->
  <text x="40" y="232" class="t" font-size="17" fill="#171522">Legal status</text>
  <rect x="300" y="212" width="140" height="34" fill="#B08A2E" rx="3"/>
  <circle cx="400" cy="229" r="5" fill="#F4F2FA"/>
  <text x="462" y="236" class="n" font-size="22" fill="#B08A2E">6</text>

  <!-- BAR 3 -->
  <text x="40" y="318" class="t" font-size="17" fill="#171522">Principles</text>
  <rect x="300" y="298" width="560" height="34" fill="#3E6B4F" rx="3"/>
  <text x="580" y="322" class="m" font-size="11" fill="#FFFFFF">NO EXPIRY SET</text>

  <!-- legend for the break point -->
  <circle cx="52" cy="376" r="5" fill="#F4F2FA" stroke="#6B6875" stroke-width="1.5"/>
  <text x="70" y="381" class="bi" font-size="13" fill="#3C4148">a ruling, a policy change, a discontinued tool — review now, whatever the clock says</text>

  <text x="40" y="410" class="m" font-size="9" fill="#5A3FD6">FULL CARD → GOV·16 · WHAT EXPIRES AND HOW YOU'LL KNOW</text>
</svg>
