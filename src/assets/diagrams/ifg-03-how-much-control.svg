<svg viewBox="0 0 940 800" xmlns="http://www.w3.org/2000/svg" width="940" height="800" role="img" aria-label="Two questions, four situations, what control to put in place" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How much control does this need?</title>
  <defs>
    <style>
      .h  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .t  { font-family: Archivo, system-ui, sans-serif; font-weight: 700; }
      .l  { font-family: Archivo, system-ui, sans-serif; font-weight: 600; }
      .m  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .b  { font-family: Newsreader, Georgia, serif; }
      .bi { font-family: Newsreader, Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="940" height="800" fill="#F4F2FA"/>

  <text x="40" y="42" class="h" font-size="21" fill="#171522">How much control does this need?</text>
  <text x="40" y="64" class="bi" font-size="13.5" fill="#3C4148">Answer both questions. Read only the box you land in.</text>

  <!-- HORIZONTAL AXIS : centred question, symmetric answers -->
  <text x="516" y="106" class="t" font-size="13.5" fill="#171522" text-anchor="middle">Does a person approve before it acts?</text>
  <text x="304" y="132" class="m" font-size="10" fill="#5A3FD6" text-anchor="middle">YES</text>
  <text x="728" y="132" class="m" font-size="10" fill="#5A3FD6" text-anchor="middle">NO</text>
  <line x1="112" y1="142" x2="920" y2="142" stroke="#D8D5E0" stroke-width="1"/>

  <!-- VERTICAL AXIS : centred question, symmetric answers -->
  <text x="62" y="418" class="t" font-size="13.5" fill="#171522" transform="rotate(-90 62 418)" text-anchor="middle">Does the outcome affect a person?</text>
  <text x="88" y="270" class="m" font-size="10" fill="#5A3FD6" transform="rotate(-90 88 270)" text-anchor="middle">NO</text>
  <text x="88" y="566" class="m" font-size="10" fill="#5A3FD6" transform="rotate(-90 88 566)" text-anchor="middle">YES</text>
  <line x1="100" y1="152" x2="100" y2="684" stroke="#D8D5E0" stroke-width="1"/>

  <!-- BOX 1 — approves / affects no one -->
  <rect x="112" y="152" width="384" height="248" fill="#FFFFFF" stroke="#D8D5E0" stroke-width="1.5" rx="3"/>
  <text x="136" y="188" class="t" font-size="17" fill="#171522">Light</text>
  <text x="136" y="222" class="b" font-size="12.5" fill="#3C4148">Log what it produced.</text>
  <text x="136" y="248" class="b" font-size="12.5" fill="#3C4148">Keep the prompt and rules under</text>
  <text x="136" y="268" class="b" font-size="12.5" fill="#3C4148">version control.</text>
  <text x="136" y="294" class="b" font-size="12.5" fill="#3C4148">Spot-check outputs from time to time.</text>
  <text x="136" y="368" class="m" font-size="9" fill="#6B6875">DRAFTING · SUMMARISING · INTERNAL SEARCH</text>

  <!-- BOX 2 — acts alone / affects no one -->
  <rect x="536" y="152" width="384" height="248" fill="#FFFFFF" stroke="#6B6875" stroke-width="1.5" rx="3"/>
  <text x="560" y="188" class="t" font-size="17" fill="#171522">Moderate</text>
  <text x="560" y="222" class="b" font-size="12.5" fill="#3C4148">Everything on the left, plus:</text>
  <text x="560" y="248" class="b" font-size="12.5" fill="#3C4148">a written stop condition, and someone</text>
  <text x="560" y="268" class="b" font-size="12.5" fill="#3C4148">who can trigger it.</text>
  <text x="560" y="294" class="b" font-size="12.5" fill="#3C4148">Alert when it behaves out of range.</text>
  <text x="560" y="368" class="m" font-size="9" fill="#6B6875">SORTING · ROUTING · TAGGING · ENRICHMENT</text>

  <!-- BOX 3 — approves / affects a person -->
  <rect x="112" y="436" width="384" height="248" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="136" y="472" class="t" font-size="17" fill="#171522">Documented</text>
  <text x="136" y="506" class="b" font-size="12.5" fill="#3C4148">Everything above, plus:</text>
  <text x="136" y="532" class="b" font-size="12.5" fill="#3C4148">record who approved, and on what basis.</text>
  <text x="136" y="558" class="b" font-size="12.5" fill="#3C4148">The approver must be able to say no</text>
  <text x="136" y="578" class="b" font-size="12.5" fill="#3C4148">in practice, not only on paper.</text>
  <text x="136" y="652" class="m" font-size="9" fill="#5A3FD6">SCORING · PRIORITISING · RECOMMENDING</text>

  <!-- BOX 4 — acts alone / affects a person -->
  <rect x="536" y="436" width="384" height="248" fill="#F7E9E7" stroke="#B03A2E" stroke-width="2" rx="3"/>
  <text x="560" y="472" class="t" font-size="17" fill="#B03A2E">Regulated</text>
  <text x="560" y="506" class="b" font-size="12.5" fill="#B03A2E">The person can ask for human review,</text>
  <text x="560" y="526" class="b" font-size="12.5" fill="#B03A2E">contest the outcome, ask why.</text>
  <text x="560" y="552" class="b" font-size="12.5" fill="#B03A2E">Full audit trail. One named owner.</text>
  <text x="560" y="578" class="b" font-size="12.5" fill="#B03A2E">May fall under GDPR Art. 22, where the</text>
  <text x="560" y="598" class="b" font-size="12.5" fill="#B03A2E">effect is legal or similarly significant.</text>
  <text x="560" y="652" class="m" font-size="9" fill="#B03A2E">AUTO-REJECTION · PRICING · ELIGIBILITY · ACCESS</text>

  <!-- CLOSING -->
  <text x="112" y="722" class="t" font-size="13" fill="#B03A2E">Most teams land bottom right by accident — by removing a human step that felt like a formality.</text>
  <text x="112" y="746" class="b" font-size="12.5" fill="#3C4148">Moving one box up or left is almost always cheaper than building the controls the box below demands.</text>

  <text x="40" y="782" class="m" font-size="9" fill="#6B6875">SOURCES · REGULATION (EU) 2016/679 ART. 22 VIA EUR-LEX · COURSE MATERIAL W5, W7</text>
</svg>
