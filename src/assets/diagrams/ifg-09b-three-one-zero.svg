<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540" role="img" aria-label="Three flagged, one page opened, zero real problems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Something looked wrong. Ten minutes settled it.</title>
  <defs>
    <style>
      .h  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .n  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .t  { font-family: Archivo, system-ui, sans-serif; font-weight: 700; }
      .l  { font-family: Archivo, system-ui, sans-serif; font-weight: 600; }
      .m  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .b  { font-family: Newsreader, Georgia, serif; }
      .bi { font-family: Newsreader, Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#F4F2FA"/>

  <text x="40" y="44" class="h" font-size="22" fill="#171522">Something looked wrong. Ten minutes settled it.</text>
  <text x="40" y="68" class="bi" font-size="14" fill="#3C4148">Audit of 27 cards, August 2026.</text>

  <!-- the spine -->
  <line x1="40" y1="146" x2="920" y2="146" stroke="#D8D5E0" stroke-width="1"/>

  <!-- BEAT 1 : wide -->
  <rect x="40" y="132" width="470" height="28" fill="#171522" rx="14"/>
  <text x="66" y="151" class="m" font-size="10" fill="#F4F2FA">WHAT CAME BACK</text>
  <text x="40" y="212" class="n" font-size="52" fill="#171522">3</text>
  <text x="92" y="196" class="t" font-size="15" fill="#171522">sources reported missing</text>
  <text x="92" y="218" class="b" font-size="12.5" fill="#3C4148">A second model went through the whole set and</text>
  <text x="92" y="236" class="b" font-size="12.5" fill="#3C4148">delivered a clear diagnosis. It read as settled.</text>

  <!-- BEAT 2 : narrower -->
  <rect x="40" y="272" width="300" height="28" fill="#5A3FD6" rx="14"/>
  <text x="66" y="291" class="m" font-size="10" fill="#FFFFFF">WHAT I DID</text>
  <text x="40" y="352" class="n" font-size="52" fill="#5A3FD6">1</text>
  <text x="92" y="336" class="t" font-size="15" fill="#171522">page opened myself</text>
  <text x="92" y="358" class="b" font-size="12.5" fill="#3C4148">Searched the source, not the report about it.</text>

  <!-- BEAT 3 : narrowest -->
  <rect x="40" y="392" width="150" height="28" fill="#3E6B4F" rx="14"/>
  <text x="66" y="411" class="m" font-size="10" fill="#FFFFFF">HOW IT ENDED</text>
  <text x="40" y="472" class="n" font-size="52" fill="#3E6B4F">0</text>
  <text x="92" y="456" class="t" font-size="15" fill="#3E6B4F">sources actually missing</text>
  <text x="92" y="478" class="b" font-size="12.5" fill="#3C4148">One sat on a different page. Two were outside the tool's reach.</text>
  <text x="92" y="496" class="b" font-size="12.5" fill="#171522">The cards stayed. So did the audit.</text>

  <!-- RIGHT COLUMN : the two takeaways, no boxes -->
  <line x1="560" y1="180" x2="560" y2="500" stroke="#D8D5E0" stroke-width="1"/>

  <text x="596" y="200" class="m" font-size="9" fill="#6B6875">WHY IT ONLY TOOK TEN MINUTES</text>
  <text x="596" y="228" class="t" font-size="16" fill="#171522">The doubt was specific,</text>
  <text x="596" y="250" class="t" font-size="16" fill="#171522">so the check was too.</text>
  <text x="596" y="278" class="b" font-size="12.5" fill="#3C4148">A tool saying a source is missing is showing</text>
  <text x="596" y="296" class="b" font-size="12.5" fill="#3C4148">you a result, not stating a fact. That one</text>
  <text x="596" y="314" class="b" font-size="12.5" fill="#3C4148">distinction told me which page to open.</text>

  <line x1="596" y1="348" x2="920" y2="348" stroke="#D8D5E0" stroke-width="1"/>

  <text x="596" y="378" class="m" font-size="9" fill="#5A3FD6">AND WHEN TO SKIP THE CHECK ENTIRELY</text>

  <circle cx="608" cy="410" r="6" fill="#3E6B4F"/>
  <text x="628" y="415" class="t" font-size="14" fill="#3E6B4F">Easy to undo → move on</text>
  <text x="628" y="435" class="b" font-size="12" fill="#3C4148">A draft, a first pass, an internal note.</text>

  <circle cx="608" cy="466" r="6" fill="#B03A2E"/>
  <text x="628" y="471" class="t" font-size="14" fill="#B03A2E">Can't take it back → check first</text>
  <text x="628" y="491" class="b" font-size="12" fill="#3C4148">A sent message, an applied decision.</text>

  <text x="40" y="528" class="m" font-size="9.5" fill="#5A3FD6">CARDS → EVL·06 WHEN TO CHECK AN AI OUTPUT · GOV·01 DOUBLE-TEST</text>
</svg>
