<svg viewBox="0 0 940 660" xmlns="http://www.w3.org/2000/svg" width="940" height="660" role="img" aria-label="Agent diagnosis: which layer to change" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Your agent isn't doing what you want. Change what?</title>
  <defs>
    <style>
      .h  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .t  { font-family: Archivo, system-ui, sans-serif; font-weight: 700; }
      .l  { font-family: Archivo, system-ui, sans-serif; font-weight: 600; }
      .m  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .b  { font-family: Newsreader, Georgia, serif; }
      .bi { font-family: Newsreader, Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="940" height="660" fill="#F4F2FA"/>

  <text x="40" y="42" class="h" font-size="21" fill="#171522">Your agent isn't doing what you want. Change what?</text>
  <text x="40" y="64" class="bi" font-size="13.5" fill="#3C4148">Match the symptom to the layer. Most people reach for the model first — it's usually the last thing to touch.</text>

  <!-- column headers -->
  <text x="40" y="102" class="m" font-size="9" fill="#6B6875">SYMPTOM</text>
  <text x="440" y="102" class="m" font-size="9" fill="#6B6875">LAYER</text>
  <text x="640" y="102" class="m" font-size="9" fill="#6B6875">WHAT YOU CHANGE</text>

  <!-- ROW 1 -->
  <rect x="40" y="112" width="860" height="66" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="58" y="138" class="t" font-size="13.5" fill="#171522">Wrong tone, wrong format, ignores your rules</text>
  <text x="58" y="160" class="b" font-size="11.5" fill="#3C4148">It answers, but not the way you asked.</text>
  <rect x="440" y="130" width="176" height="30" fill="#5A3FD6" rx="3"/>
  <text x="528" y="150" class="t" font-size="12.5" fill="#FFFFFF" text-anchor="middle">System prompt · Rules</text>
  <text x="640" y="150" class="b" font-size="12.5" fill="#171522">Rewrite the instruction. Cheapest fix.</text>

  <!-- ROW 2 -->
  <rect x="40" y="190" width="860" height="66" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="58" y="216" class="t" font-size="13.5" fill="#171522">Can't do the step at all</text>
  <text x="58" y="238" class="b" font-size="11.5" fill="#3C4148">Says it cannot, or fabricates the result.</text>
  <rect x="440" y="208" width="176" height="30" fill="#5A3FD6" rx="3"/>
  <text x="528" y="228" class="t" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Tools · Skills</text>
  <text x="640" y="228" class="b" font-size="12.5" fill="#171522">Give it the tool, or the access it lacks.</text>

  <!-- ROW 3 -->
  <rect x="40" y="268" width="860" height="66" fill="#FFFFFF" stroke="#171522" stroke-width="1.5" rx="3"/>
  <text x="58" y="294" class="t" font-size="13.5" fill="#171522">Right method, wrong facts</text>
  <text x="58" y="316" class="b" font-size="11.5" fill="#3C4148">Reasoning holds, content is outdated or invented.</text>
  <rect x="440" y="286" width="176" height="30" fill="#FFFFFF" stroke="#171522" stroke-width="1.5" rx="3"/>
  <text x="528" y="306" class="t" font-size="12.5" fill="#171522" text-anchor="middle">Data</text>
  <text x="640" y="306" class="b" font-size="12.5" fill="#171522">Fix the source, not the agent.</text>

  <!-- ROW 4 -->
  <rect x="40" y="346" width="860" height="66" fill="#FFFFFF" stroke="#D8D5E0" stroke-width="1.5" rx="3"/>
  <text x="58" y="372" class="t" font-size="13.5" fill="#171522">Everything above already checked</text>
  <text x="58" y="394" class="b" font-size="11.5" fill="#3C4148">Task genuinely beyond what this model can do.</text>
  <rect x="440" y="364" width="176" height="30" fill="#FFFFFF" stroke="#D8D5E0" rx="3"/>
  <text x="528" y="384" class="b" font-size="12.5" fill="#6B6875" text-anchor="middle">Model tier</text>
  <text x="640" y="384" class="b" font-size="12.5" fill="#6B6875">Change the model. Last resort, not first.</text>

  <!-- THE LINE -->
  <rect x="40" y="440" width="860" height="76" fill="#F7E9E7" stroke="#B03A2E" stroke-width="2" rx="3"/>
  <text x="58" y="466" class="m" font-size="9" fill="#B03A2E">WHY THE ORDER MATTERS</text>
  <text x="58" y="490" class="t" font-size="14" fill="#B03A2E">The top three layers are yours. The model tier belongs to the platform.</text>
  <text x="58" y="509" class="b" font-size="12" fill="#B03A2E">Swapping the model is not reconfiguring the agent — and it hides the problem instead of fixing it.</text>

  <text x="40" y="556" class="b" font-size="12" fill="#3C4148">Other breakdowns of "what an agent is" circulate. They don't all describe the same layer — <tspan class="t" fill="#171522">don't merge them.</tspan></text>

  <rect x="40" y="576" width="860" height="1" fill="#D8D5E0"/>
  <text x="40" y="598" class="m" font-size="9.5" fill="#5A3FD6">FULL CARD → BLD·02 · AGENT CONFIGURATION</text>
  <text x="40" y="616" class="m" font-size="9.5" fill="#5A3FD6">SEE ALSO → PRM·03 · THREE QUESTIONS BEFORE CONCLUDING THE AGENT IS BAD</text>
</svg>
