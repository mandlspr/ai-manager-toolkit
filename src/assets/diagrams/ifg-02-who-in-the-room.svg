<svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" width="880" height="520" role="img" aria-label="Who to bring in, and when" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Who do you need in the room?</title>
  <defs>
    <style>
      .h  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .t  { font-family: Archivo, system-ui, sans-serif; font-weight: 700; }
      .l  { font-family: Archivo, system-ui, sans-serif; font-weight: 600; }
      .m  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .b  { font-family: Newsreader, Georgia, serif; }
      .bi { font-family: Newsreader, Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="880" height="520" fill="#F4F2FA"/>

  <text x="40" y="42" class="h" font-size="21" fill="#171522">Who do you need in the room?</text>

  <!-- ALWAYS -->
  <rect x="40" y="66" width="800" height="70" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="58" y="88" class="m" font-size="9" fill="#5A3FD6">ALWAYS</text>
  <circle cx="70" cy="112" r="10" fill="#5A3FD6"/>
  <text x="70" y="116" class="m" font-size="10" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="90" y="117" class="t" font-size="14" fill="#171522">Use-case owner</text>
  <text x="300" y="117" class="t" font-size="14" fill="#171522">AI manager</text>
  <text x="520" y="117" class="t" font-size="14" fill="#171522">IT / security</text>

  <!-- TRIGGERS -->
  <text x="40" y="168" class="m" font-size="9" fill="#6B6875">IF YES → BRING THEM IN</text>

  <rect x="40" y="180" width="390" height="72" fill="#FFFFFF" stroke="#171522" stroke-width="2" rx="3"/>
  <text x="58" y="204" class="t" font-size="13.5" fill="#171522">Monitors or evaluates staff?</text>
  <text x="58" y="230" class="l" font-size="13" fill="#5A3FD6">Works council</text>
  <rect x="196" y="216" width="52" height="19" fill="#5A3FD6" rx="9"/>
  <text x="222" y="230" class="m" font-size="9" fill="#FFFFFF" text-anchor="middle">EARLY</text>

  <rect x="450" y="180" width="390" height="72" fill="#FFFFFF" stroke="#171522" stroke-width="2" rx="3"/>
  <text x="468" y="204" class="t" font-size="13.5" fill="#171522">Processes personal data?</text>
  <text x="468" y="230" class="l" font-size="13" fill="#5A3FD6">Data protection officer</text>
  <rect x="646" y="216" width="52" height="19" fill="#5A3FD6" rx="9"/>
  <text x="672" y="230" class="m" font-size="9" fill="#FFFFFF" text-anchor="middle">EARLY</text>

  <rect x="40" y="264" width="390" height="72" fill="#FFFFFF" stroke="#D8D5E0" stroke-width="1.5" rx="3"/>
  <text x="58" y="288" class="t" font-size="13.5" fill="#171522">Changes how a team works?</text>
  <text x="58" y="314" class="l" font-size="13" fill="#5A3FD6">The team itself</text>
  <rect x="176" y="300" width="52" height="19" fill="#5A3FD6" rx="9"/>
  <text x="202" y="314" class="m" font-size="9" fill="#FFFFFF" text-anchor="middle">EARLY</text>

  <rect x="450" y="264" width="390" height="72" fill="#FFFFFF" stroke="#D8D5E0" stroke-width="1.5" rx="3"/>
  <text x="468" y="288" class="t" font-size="13.5" fill="#171522">New supplier or contract?</text>
  <text x="468" y="314" class="l" font-size="13" fill="#171522">Legal, procurement</text>
  <rect x="638" y="300" width="86" height="19" fill="#FFFFFF" stroke="#6B6875" rx="9"/>
  <text x="681" y="314" class="m" font-size="9" fill="#6B6875" text-anchor="middle">ON DEMAND</text>

  <!-- TWO RULES -->
  <rect x="40" y="356" width="390" height="60" fill="#5A3FD6" rx="3"/>
  <text x="58" y="380" class="t" font-size="13" fill="#FFFFFF">EARLY = before the scope is written</text>
  <text x="58" y="401" class="b" font-size="11.5" fill="#EDE9FB">Later, you're asking approval — not input.</text>

  <rect x="450" y="356" width="390" height="60" fill="none" stroke="#B08A2E" stroke-width="1.5" stroke-dasharray="6 4" rx="3"/>
  <text x="468" y="380" class="t" font-size="13" fill="#171522">Role doesn't exist here?</text>
  <text x="468" y="401" class="b" font-size="11.5" fill="#3C4148">Name who covers it, in writing.</text>

  <text x="40" y="452" class="b" font-size="12" fill="#3C4148">RACI is set per decision, not per person. What never changes: <tspan class="t" fill="#5A3FD6">one A, and only one.</tspan></text>
  <text x="40" y="470" class="m" font-size="9" fill="#6B6875">R RESPONSIBLE · A ACCOUNTABLE · C CONSULTED · I INFORMED</text>

  <rect x="40" y="486" width="800" height="1" fill="#D8D5E0"/>
  <text x="40" y="506" class="m" font-size="9.5" fill="#5A3FD6">FULL CARD → GOV·13 · WHO DECIDES, AND WHEN THE WORKS COUNCIL COMES IN</text>
</svg>
