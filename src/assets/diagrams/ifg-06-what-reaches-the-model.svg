<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" width="960" height="700" role="img" aria-label="What reaches the model, stage by stage, with guardrails" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>What reaches the model?</title>
  <defs>
    <style>
      .h  { font-family: Archivo, system-ui, sans-serif; font-weight: 800; }
      .t  { font-family: Archivo, system-ui, sans-serif; font-weight: 700; }
      .l  { font-family: Archivo, system-ui, sans-serif; font-weight: 600; }
      .m  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .b  { font-family: Newsreader, Georgia, serif; }
      .bi { font-family: Newsreader, Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="960" height="700" fill="#F4F2FA"/>

  <text x="40" y="42" class="h" font-size="21" fill="#171522">What reaches the model?</text>
  <text x="40" y="64" class="bi" font-size="13.5" fill="#3C4148">Everything is filtered before the call. Nothing can be filtered after it.</text>

  <!-- column headers -->
  <text x="40" y="102" class="m" font-size="9" fill="#6B6875">STAGE</text>
  <text x="500" y="102" class="m" font-size="9" fill="#6B6875">GUARDRAILS THAT APPLY HERE</text>

  <!-- ROW 1 -->
  <rect x="40" y="112" width="880" height="70" fill="#FFFFFF" stroke="#D8D5E0" stroke-width="1.5" rx="3"/>
  <text x="62" y="140" class="m" font-size="9" fill="#6B6875">01 · ARRIVES</text>
  <text x="62" y="164" class="t" font-size="15" fill="#171522">Raw request</text>
  <rect x="500" y="132" width="196" height="28" fill="#F4F2FA" stroke="#D8D5E0" rx="3"/>
  <text x="598" y="151" class="b" font-size="11.5" fill="#171522" text-anchor="middle">Minimum permissions</text>
  <rect x="708" y="132" width="196" height="28" fill="#F4F2FA" stroke="#D8D5E0" rx="3"/>
  <text x="806" y="151" class="b" font-size="11.5" fill="#171522" text-anchor="middle">Strict access control</text>

  <!-- ROW 2 -->
  <rect x="40" y="192" width="880" height="70" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="62" y="220" class="m" font-size="9" fill="#5A3FD6">02 · FILTER, YOUR SIDE</text>
  <text x="62" y="244" class="t" font-size="15" fill="#171522">Strip personal data <tspan class="b" font-size="12.5" fill="#B03A2E">— removed, not masked</tspan></text>
  <rect x="500" y="212" width="196" height="28" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="598" y="231" class="b" font-size="11.5" fill="#171522" text-anchor="middle">Limited tool set</text>

  <!-- ROW 3 -->
  <rect x="40" y="272" width="880" height="70" fill="#EDE9FB" stroke="#5A3FD6" stroke-width="2" rx="3"/>
  <text x="62" y="300" class="m" font-size="9" fill="#5A3FD6">03 · FILTER, YOUR SIDE</text>
  <text x="62" y="324" class="t" font-size="15" fill="#171522">Apply business rules <tspan class="b" font-size="12.5" fill="#B03A2E">— financial, medical, legal never leave</tspan></text>
  <rect x="500" y="292" width="196" height="28" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="598" y="311" class="b" font-size="11.5" fill="#171522" text-anchor="middle">Clear stop conditions</text>
  <rect x="708" y="292" width="196" height="28" fill="#FFFFFF" stroke="#5A3FD6" rx="3"/>
  <text x="806" y="311" class="b" font-size="11.5" fill="#171522" text-anchor="middle">Approval on risky actions</text>

  <!-- ROW 4 : the call -->
  <rect x="40" y="352" width="880" height="70" fill="#5A3FD6" rx="3"/>
  <text x="62" y="380" class="m" font-size="9" fill="#C9BEF5">04 · THE ONLY STEP THAT LEAVES YOUR PERIMETER</text>
  <text x="62" y="404" class="t" font-size="15" fill="#FFFFFF">The model is called</text>
  <rect x="500" y="372" width="196" height="28" fill="#4A32B8" rx="3"/>
  <text x="598" y="391" class="b" font-size="11.5" fill="#FFFFFF" text-anchor="middle">Systematic logging</text>

  <!-- ROW 5 -->
  <rect x="40" y="432" width="880" height="70" fill="#FFFFFF" stroke="#171522" stroke-width="1.5" rx="3"/>
  <text x="62" y="460" class="m" font-size="9" fill="#6B6875">05 · COMES BACK</text>
  <text x="62" y="484" class="t" font-size="15" fill="#171522">Validate before anything acts on it</text>
  <rect x="500" y="452" width="196" height="28" fill="#F4F2FA" stroke="#D8D5E0" rx="3"/>
  <text x="598" y="471" class="b" font-size="11.5" fill="#171522" text-anchor="middle">Output validation</text>
  <rect x="708" y="452" width="196" height="28" fill="#F4F2FA" stroke="#D8D5E0" rx="3"/>
  <text x="806" y="471" class="b" font-size="11.5" fill="#171522" text-anchor="middle">Block on low confidence</text>

  <!-- THREE NOTES, aligned as thirds -->
  <rect x="40" y="530" width="284" height="94" fill="#FFFFFF" stroke="#B08A2E" stroke-width="1.5" rx="3"/>
  <text x="62" y="554" class="m" font-size="9" fill="#B08A2E">A NINTH RULE, SEPARATE</text>
  <text x="62" y="578" class="t" font-size="13" fill="#171522">Never delete, archive</text>
  <text x="62" y="600" class="b" font-size="11.5" fill="#3C4148">An agent must not remove</text>
  <text x="62" y="616" class="b" font-size="11.5" fill="#3C4148">anything a human can't restore.</text>

  <rect x="338" y="530" width="284" height="94" fill="#FFFFFF" stroke="#D8D5E0" stroke-width="1.5" rx="3"/>
  <text x="360" y="554" class="m" font-size="9" fill="#6B6875">NOT AN AI RULE</text>
  <text x="360" y="578" class="t" font-size="13" fill="#171522">Same position in any chain</text>
  <text x="360" y="600" class="b" font-size="11.5" fill="#3C4148">ETL before analysis, validation</text>
  <text x="360" y="616" class="b" font-size="11.5" fill="#3C4148">before write. Bad data in, bad out.</text>

  <rect x="636" y="530" width="284" height="94" fill="#FFFFFF" stroke="#5A3FD6" stroke-width="1.5" rx="3"/>
  <text x="658" y="554" class="m" font-size="9" fill="#5A3FD6">FOR CREATIVE WORK</text>
  <text x="658" y="578" class="t" font-size="13" fill="#171522">Loosen the dials, not the filters</text>
  <text x="658" y="600" class="b" font-size="11.5" fill="#3C4148">Temperature and token limits open.</text>
  <text x="658" y="616" class="b" font-size="11.5" fill="#3C4148">What you may send does not.</text>

  <text x="40" y="666" class="m" font-size="9.5" fill="#5A3FD6">FULL CARD → BLD·06 · EIGHT GUARDRAILS FOR AGENTS</text>
</svg>
